appId: com.upcurved.desktop
productName: UpcurvEd

directories:
  output: release

files:
  - desktop/**/*
  - "!desktop/python-runtime/**"
  - frontend/dist/**/*
  - backend/**/*
  - package.json
  - "!backend/**/__pycache__/**"
  - "!backend/**/*.pyc"
  - "!backend/.env"
  - "!tests/**"
  - "!.github/**"

# Default is `maximum` (LZMA), which makes installs slow to unpack. `normal` trades
# ~10-15% download size for a noticeably faster install, and speeds up CI builds too.
compression: normal

asar: true
asarUnpack:
  - backend/**/*

extraResources:
  - from: desktop/python-runtime/
    to: python-runtime
    filter:
      - "**/*"

extraMetadata:
  main: desktop/main.cjs

# No ${version}: keeps release filenames stable so the landing page can link to
# releases/latest/download/<name> permanently, without editing URLs each release.
artifactName: ${productName}-${os}-${arch}.${ext}

mac:
  icon: desktop/icons/icon.icns
  category: public.app-category.education
  identity: "-"
  hardenedRuntime: false
  target:
    - target: dmg

win:
  icon: desktop/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: desktop/icons/icon-512.png
  target:
    - AppImage
  category: Education
